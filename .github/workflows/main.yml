name: Build APKs
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 9.3.1 }

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build
        run: gradle assembleDebug --stacktrace

      - name: List APKs
        run: find . -name "*.apk"

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Kingo-Admin-APK
          path: "**/build/outputs/apk/admin/debug/*.apk"

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: Kingo-King-User-APK
          path: "**/build/outputs/apk/user/debug/*.apk"
